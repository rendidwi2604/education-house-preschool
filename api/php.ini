; ============================================================
; PHP Configuration untuk Vercel (vercel-php runtime)
; File ini dibaca otomatis oleh vercel-php dari folder api/
; ============================================================

; ── Batas ukuran & eksekusi ──────────────────────────────────
memory_limit        = 256M
max_execution_time  = 30
max_input_time      = 30

; ── Upload file (admin panel) ────────────────────────────────
; CATATAN: Di Vercel, file yang diupload disimpan ke /tmp dan
; HILANG setelah function selesai. Gunakan Supabase Storage
; atau Cloudinary untuk upload gambar permanent.
upload_max_filesize = 10M
post_max_size       = 12M
file_uploads        = On

; ── Session ──────────────────────────────────────────────────
; Vercel serverless tidak persistent antar request, tapi session
; PHP via cookie tetap berfungsi selama satu eksekusi
session.use_strict_mode      = 1
session.cookie_httponly      = 1
session.cookie_secure        = 1
session.cookie_samesite      = Lax
session.gc_maxlifetime        = 3600

; ── Error handling (production) ──────────────────────────────
; Matikan tampilan error ke browser, log saja
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_reporting        = E_ALL

; ── Timezone ─────────────────────────────────────────────────
date.timezone = Asia/Jakarta

; ── OpenSSL / cURL (untuk koneksi Supabase SSL) ──────────────
; vercel-php sudah include openssl dan curl secara default
; tidak perlu konfigurasi tambahan

; ── Output buffering ─────────────────────────────────────────
output_buffering = 4096
